[project]
name = "contigo"
version = "0.1.0"
description = "Contigo — Tus finanzas, a tu ritmo. Asistente financiero conversacional vía WhatsApp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
